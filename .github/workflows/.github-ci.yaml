name: PGATS Automation Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/actions-setup@v4
        with:
          node-version: '22' 
      - name: Install dependencies and run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome 
        